name: Apply hyperlink integration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_hyperlink_integration.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply targeted editor integration
        run: python3 scripts/apply_hyperlink_integration.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/alal/notes/ui/editor/EditorScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire Word-style hyperlink actions into editor"
          git push
