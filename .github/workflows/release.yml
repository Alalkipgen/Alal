name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon -q
          fi
          chmod +x gradlew

      - name: Fetch fonts
        continue-on-error: true
        run: bash scripts/fetch-fonts.sh

      - name: Validate permanent signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing $name secret"
              exit 1
            fi
          done

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/alal.jks

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: alal.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/notes-${GITHUB_REF_NAME}.apk"

      - name: Verify permanent APK signer
        env:
          EXPECTED_CERT_SHA256: "039677011d6d538dbf384e7ba623a061acf176a2c543fc869a37c961fe22cf28"
        run: |
          set -euo pipefail
          apk="dist/notes-${GITHUB_REF_NAME}.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          signature_output="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$signature_output"
          actual_cert_sha256="$(printf '%s\n' "$signature_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          if [ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Release APK was not signed by the permanent Notes key"
            exit 1
          fi
          echo "Permanent release signature verified"

      - name: Source archive
        run: git archive --format=zip --prefix=notes/ -o "dist/notes-${GITHUB_REF_NAME}-source.zip" "$GITHUB_REF_NAME"

      - uses: softprops/action-gh-release@v2
        with:
          name: Notes ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*-source.zip
