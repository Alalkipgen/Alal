name: Editor open hold

on:
  push:
    paths:
      - ".github/workflows/editor-open-hold.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Apply hold
        run: python3 scripts/add_editor_open_hold.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/alal/notes/ui/AlalRoot.kt
          git commit -m "fix: hold editor off-screen for 450 ms before opening"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
