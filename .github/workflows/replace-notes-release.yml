name: Replace Notes release with full-bleed icon

on:
  push:
    branches: [main]
    paths: [".release/notes-v1.3.6"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replace-notes-release-v1.3.6
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: release-1.3.6
      APK_NAME: Notes-v1.3.6.apk
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - name: Generate Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon -q
          fi
          chmod +x gradlew
      - name: Verify full-bleed icon and release version
        run: |
          set -euo pipefail
          bg=app/src/main/res/drawable/ic_launcher_background.xml
          fg=app/src/main/res/drawable/ic_launcher_foreground.xml
          mono=app/src/main/res/drawable/ic_launcher_monochrome.xml
          grep -q 'M0,0h108v108h-108z' "$bg"
          grep -q '#FF3D7DF5' "$bg"
          ! grep -q '#FFDDEEFD' "$bg"
          grep -q 'android:scaleX="1.4"' "$fg"
          grep -q 'M32,22 L76,22' "$mono"
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'versionName = "1.3.6"' app/build.gradle.kts
      - name: Fetch fonts
        continue-on-error: true
        run: bash scripts/fetch-fonts.sh
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error::Missing $name"; exit 1; }
          done
      - name: Decode permanent keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/alal.jks
      - name: Compile, test and build signed APK
        env:
          KEYSTORE_PATH: alal.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon --console=plain
          ./gradlew testDebugUnitTest --no-daemon --console=plain
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace
      - name: Package and verify signer
        env:
          EXPECTED_CERT_SHA256: "039677011d6d538dbf384e7ba623a061acf176a2c543fc869a37c961fe22cf28"
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$apk" && test -s "$apk"
          cp "$apk" "dist/$APK_NAME"
          output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/$APK_NAME")"
          printf '%s\n' "$output"
          actual="$(printf '%s\n' "$output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          sha="$(cut -d' ' -f1 "dist/$APK_NAME.sha256")"
          cat > dist/RELEASE_NOTES.md <<NOTES
          ## Notes v1.3.6

          - Restores the validated full-bleed launcher icon from GitHub Actions run 36043603570.
          - Removes the pale plate that made the notebook artwork look too small.
          - Permanently signed; certificate SHA-256 verified in CI.

          APK SHA-256: $sha
          NOTES
      - name: Create verified draft
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --target "$GITHUB_SHA" --title "Notes v1.3.6" \
            --notes-file dist/RELEASE_NOTES.md --draft
      - name: Delete old releases and publish v1.3.6
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$RELEASE_TAG" ] && continue
            gh release delete "$tag" --cleanup-tag --yes
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json name,tagName,isDraft,url,assets
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Notes-v1.3.6-release-files
          path: |
            dist/*.apk
            dist/*.sha256
            dist/RELEASE_NOTES.md
          if-no-files-found: ignore
