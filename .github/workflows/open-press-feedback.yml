name: Open press feedback patch

on:
  push:
    paths:
      - ".github/workflows/open-press-feedback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Apply patch
        run: python3 scripts/open_press_feedback.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: prefetch notes on open and answer taps with press feedback" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Mark build success
        run: |
          echo "ok $(date -u +%FT%TZ)" > .open-press-build-ok
          git add .open-press-build-ok
          git commit -m "test: verify open press feedback build"
          git pull --rebase origin main
          git push origin HEAD:main
