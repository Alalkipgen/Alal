name: Generate keystore (run once)

# Creates a release signing keystore in CI so you never need local tools.
# Run this ONCE from the Actions tab, download the artifact, then add the four
# repository secrets it prints. Never commit alal.jks to the repo.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: Key alias
        required: true
        default: alal
      store_password:
        description: Keystore password (min 6 chars). Save it — you need it as a secret.
        required: true
      key_password:
        description: Key password (min 6 chars). Can be the same as the keystore password.
        required: true
      dname:
        description: Certificate distinguished name
        required: true
        default: "CN=Alal, OU=Notes, O=Alal, L=Yangon, C=MM"

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_PASSWORD: ${{ inputs.key_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          DNAME: ${{ inputs.dname }}
        run: |
          set -euo pipefail
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/alal.jks \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 \
            -validity 10950 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "$DNAME"
          base64 -w0 out/alal.jks > out/alal.jks.base64
          echo "Keystore fingerprint:"
          keytool -list -v -keystore out/alal.jks -storepass "$STORE_PASSWORD" | grep -E 'SHA256|Alias'

      - name: Print next steps
        run: |
          cat <<'EOF'
          ================================================================
           NEXT STEPS — add these 4 repository secrets
           (Settings → Secrets and variables → Actions → New repository secret)
          ================================================================
           KEYSTORE_BASE64   = contents of alal.jks.base64 (from the artifact)
           KEYSTORE_PASSWORD = the keystore password you entered
           KEY_ALIAS         = the alias you entered
           KEY_PASSWORD      = the key password you entered
          ----------------------------------------------------------------
           Then re-run "Build APK". Keep alal.jks somewhere safe & private:
           you need the SAME keystore to publish updates of the app.
          ================================================================
          EOF

      - uses: actions/upload-artifact@v5
        with:
          name: alal-keystore
          path: out/
          retention-days: 7
          if-no-files-found: error
