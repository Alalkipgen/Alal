name: Hybrid note open

on:
  push:
    paths:
      - ".github/workflows/hybrid-note-open.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Apply hybrid patch
        run: python3 scripts/hybrid_note_open.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main
          git commit -m "perf: open notes from a bounded warm cache"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Build and test
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee hybrid-note-open-build.log
          RESULT=${PIPESTATUS[0]}
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit build result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.build.outputs.result }}" = "0" ]; then
            date -u > .hybrid-note-open-build-ok
            rm -f hybrid-note-open-build.log
            git add -A
            git commit -m "test: verify hybrid note-open build"
          else
            git add hybrid-note-open-build.log
            git commit -m "test: capture hybrid note-open build failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
