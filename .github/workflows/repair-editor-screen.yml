name: Repair EditorScreen
on:
  push:
    branches: [main]
    paths:
      - scripts/repair_editor_screen.py
      - .github/workflows/repair-editor-screen.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore truncated source
        run: |
          python3 scripts/repair_editor_screen.py
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app/src/main/java/com/alal/notes/ui/editor/EditorScreen.kt
            git commit -m 'fix: restore truncated EditorScreen overflow menu'
            git push
          fi
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Record build result
        run: |
          git pull --rebase
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          echo "EditorScreen repair build verified" > .editor-repair-build-ok
          git add .editor-repair-build-ok
          git commit -m 'test: verify EditorScreen repair build'
          git push
